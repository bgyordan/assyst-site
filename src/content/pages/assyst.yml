      - { title: S, text: Stabilization }
      - { title: T, text: Technique }
  - type: cards
    label: Времева рамка за прилагане
    style: timeline
    columns: 3
    note: "Психологическа първа помощ → **ASSYST запълва тази празнина** → Високоинтензивна психотерапия"
    items:
      - { meta: Critical Care, title: Първите часове, text: Непосредствено след травматичното събитие — максимална ранна интервенция. }
      - { meta: Rapid Response, title: Първите дни, text: Бързо разгръщане в първите 72 часа след инцидента. }
      - { meta: Early Intervention, title: До 3 месеца, text: Ранна индивидуална или психосоциална интервенция в периода след острата фаза. }
  - type: text
    label: Научни доказателства
    heading: Доказана ефективност при хиляди хора
    body: |
      Въпреки че процедурите ASSYST са разработени за ранна интервенция, научните изследвания предоставят доказателства за тяхната ефективност, ефикасност и безопасност при намаляване на симптомите на:

      - Посттравматично стресово разстройство (ПТСР)
      - Тревожност
      - Депресия

      Процедурите принадлежат към родословното дърво на EMDR протоколите — сред най-добре изследваните подходи в областта на травматерапията.
    aside_big: 90+
    aside_title: рецензирани научни публикации, доказващи **ефективността, ефикасността и безопасността** на протокола
  - type: text
    label: Теоретична основа
    heading: Adaptive Information Processing (AIP)
    body: ASSYST е базиран на модела Adaptive Information Processing, разработен от д-р Франсин Шапиро — теоретичната рамка, която стои в основата на EMDR терапията. Моделът обяснява как травматичните спомени се „заключват” в нервната система и пречат на нормалното функциониране, и как структурираната интервенция може да стимулира естествения процес на адаптивна обработка.
  - type: list
    label: Приложен при
    style: chips
    items: [🌍 Земетресения, 🔥 Горски пожари, 🔫 Масови стрелби, 🌀 Урагани и торнада, 🌊 Наводнения, 💥 Газови експлозии, 🦠 Пандемия COVID-19, 🏕️ Бежанци и търсещи убежище, 🚗 Оцелели от катастрофи, 👩 Жени с ПТСР, 👦 Деца с неблагоприятни преживявания, ⛰️ Свлачища]
  - type: cta
    heading: Искате да научите повече за ASSYST?
    text: Свържете се с нас за информация относно обучения, супервизия и прилагане на протокола в България.
    buttons:
