title: ASSYST
slug: assyst
description: ASSYST (Acute Stress Syndrome Stabilization) – протокол за ранна психологическа интервенция, базиран на модела AIP и EMDR терапията.
hero:
  label: Протокол за ранна психологическа интервенция
  watermark: ASSYST
  title: Acute Stress Syndrome *Stabilization*
  subtitle: Акутна Стресова Синдромна Стабилизация
  text: Кратка, структурирана, травма-информирана интервенция, разработена за хора преживели травматични събития, бедствия или продължителен стрес. Базирана на модела Adaptive Information Processing — в основата на EMDR терапията.
