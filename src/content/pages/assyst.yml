  - type: stats
    stats:
      - { value: 90+, label: Научни публикации }
      - { value: 1000+, label: Третирани участници }
      - { value: 20+, label: Държави по света }
  - type: cards
    label: Какво означава ASSYST
    style: letters
    columns: 6
    items:
      - { title: A, text: Acute }
      - { title: S, text: Stress }
      - { title: S, text: Syndrome }
