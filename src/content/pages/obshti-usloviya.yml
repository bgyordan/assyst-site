body: |
  ## 1. Информация за сдружението

  Информацията по чл. 4 от Закона за електронната търговия:

  - **Наименование:** Сдружение „АССИСТ – БЪЛГАРИЯ“ (ASSYST BULGARIA), юридическо лице с нестопанска цел за осъществяване на дейност в обществена полза
  - **ЕИК:** 208672895, вписано в Търговския регистър и регистъра на ЮЛНЦ към Агенцията по вписванията
  - **Седалище и адрес на управление:** гр. София, ж.к. Манастирски ливади – Изток, ул. „Тодор Джебаров“ 43А, ап. 29
  - **Имейл:** [assystbulgaria@gmail.com](mailto:assystbulgaria@gmail.com)
  - **Телефон:** [+359 896 878 305](tel:+359896878305)

  ## 2. Предназначение на сайта

  Сайтът assyst.bg представя дейността на сдружението: ранна психологическа подкрепа при бедствия и кризи, протокола ASSYST, обучения, събития и възможности за дарение.

  ## 3. Важно: сайтът не е медицински съвет

  - Информацията на сайта е **с общообразователна цел**. Тя не замества консултация, диагноза или лечение от квалифициран специалист.
  - Материалите за самопомощ не са подходящи за самостоятелно справяне при тежки или продължителни симптоми. Потърсете специалист.
  - **Сайтът и формата за контакт не са канал за спешна помощ.** При непосредствена опасност за живота или здравето звънете на **112**. За деца и родители работи Националната телефонна линия за деца **116 111**.

  ## 4. Интелектуална собственост

  Текстовете, снимките, логото и материалите на сайта са собственост на сдружението или се използват с разрешение на авторите си. Можете да ги цитирате и споделяте с некомерсиална цел, като посочите източника. За друга употреба е нужно писмено съгласие.

  Протоколите ASSYST са разработени от д-р Игнасио Хареро и ASSYST Humanitarian & Research Projects. EMDR е метод, разработен от д-р Франсин Шапиро. Прилагането им изисква специализирано обучение.

  ## 5. Обучения и събития

  Конкретните условия за всяко обучение или събитие (такса, срокове, отказ, сертифициране) се обявяват в неговата обява или при записване.

  ## 6. Дарения

  Даренията са доброволни и се използват за целите на сдружението. Като организация в обществена полза, даренията към ASSYST BULGARIA могат да се ползват за данъчни облекчения по ЗКПО и ЗДДФЛ. При поискване издаваме документ за дарение.

  ## 7. Връзки към други сайтове

  Не отговаряме за съдържанието и политиките на външни сайтове, към които водят връзки от нашия сайт.

  ## 8. Отговорност

  Полагаме грижа информацията да е точна и актуална, но не гарантираме пълнотата ѝ във всеки момент. Не носим отговорност за вреди от използване на информацията без консултация със специалист.

  ## 9. Лични данни

  Обработването на лични данни е описано в [Политиката за поверителност](/privacy-policy/) и [Политиката за бисквитки](/cookie-policy/).

  ## 10. Приложимо право и промени

  За неуредените въпроси се прилага българското законодателство. Можем да променяме тези условия. Актуалната версия е винаги на тази страница.
