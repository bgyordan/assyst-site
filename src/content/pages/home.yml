    intro: "**ASSYST BULGARIA** е неправителствена организация в обществена полза, насочена към ранна психологическа подкрепа и психосоциална стабилизация при бедствия, кризи, масови инциденти и продължителен стрес. Организацията работи за развитието на устойчив капацитет за спешна психологическа помощ чрез обучение, теренна работа, супервизия и международно сътрудничество."
