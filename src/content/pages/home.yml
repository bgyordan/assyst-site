  - type: text
    label: Протоколът ASSYST
    heading: Какво е ASSYST?
    body: |
      ASSYST (Acute Stress Syndrome Stabilization) е кратка, структурирана, травма-информирана интервенция, разработена от д-р Игнасио Хареро. Базиран е на модела Adaptive Information Processing (AIP) — теоретичната основа на EMDR терапията.

      Прилага се индивидуално и групово, запълва пространството между Психологическата първа помощ и дългосрочната психотерапия. Използва се в множество държави при природни бедствия, войни, масови инциденти и хуманитарни кризи.

      [Научи повече за протокола →](/assyst/)
    aside_title: Прилага се при
    aside_items:
      - Земетресения и природни бедствия
      - Масови инциденти и катастрофи
      - Пандемии и хуманитарни кризи
      - Бежанци и търсещи убежище
      - Деца с неблагоприятни преживявания
      - Първи реагиращи екипи
  - type: cta
    heading: Помогнете ни да помагаме
    text: Вашата подкрепа позволява на ASSYST BULGARIA да предоставя безплатна психологическа помощ на хора в нужда в целия регион.
