body: |
  ## 1. Кой е администратор на данните

  **Сдружение „АССИСТ – БЪЛГАРИЯ“ (ASSYST BULGARIA)**, ЕИК 208672895, със седалище и адрес на управление: гр. София, ж.к. Манастирски ливади – Изток, ул. „Тодор Джебаров“ 43А, ап. 29.

  Имейл: [assystbulgaria@gmail.com](mailto:assystbulgaria@gmail.com) · Телефон: [+359 896 878 305](tel:+359896878305)

  Обработваме личните данни в съответствие с Регламент (ЕС) 2016/679 (GDPR), Закона за защита на личните данни и нашите [Вътрешни правила за защита на личните данни](/dokumenti/).

  ## 2. Какви данни обработваме и с каква цел

  | Кога | Какви данни | Цел | Правно основание |
  |---|---|---|---|
  | Пишете ни чрез формата за контакт | име, имейл, телефон (по желание), тема, съобщение | да отговорим на запитването ви | вашето съгласие (чл. 6, ал. 1, б. „а“ GDPR) |
  | Пишете ни по имейл или се обаждате | данните, които сами ни предоставите | да отговорим и да организираме помощ | съгласие и легитимен интерес (чл. 6, ал. 1, б. „а“ и „е“) |
  | Записвате се за обучение или събитие | име, контакти, професия, данни за плащане | организиране на обучението и издаване на сертификат | договор (чл. 6, ал. 1, б. „б“) |
  | Правите дарение | име, сума, банкови данни от превода | отчитане на дарението | законово задължение (чл. 6, ал. 1, б. „в“) |
  | Разглеждате сайта | IP адрес, вид браузър, дата и час | сигурност и защита от злоупотреби | легитимен интерес (чл. 6, ал. 1, б. „е“) |

  Не използваме данните ви за реклама, не правим профилиране и не вземаме автоматизирани решения.

  ## 3. Чувствителна информация за здравето

  Работата ни е свързана с травматични преживявания и психично здраве. Такива данни са **специална категория** по чл. 9 GDPR.

  - Моля, **не изпращайте подробна информация** за здравословното си състояние или за преживяното чрез формата за контакт или по имейл. Достатъчно е да ни кажете как да се свържем с вас.
  - Ако все пак ни предоставите такава информация, ще я използваме само за да ви отговорим и насочим, при спазване на професионалната тайна и на [Етичните принципи](/dokumenti/) на сдружението, въз основа на вашето изрично съгласие (чл. 9, ал. 2, б. „а“ GDPR).
  - Данните от индивидуална или групова психологическа работа не се въвеждат и не се съхраняват чрез този сайт.

  > **Сайтът не е канал за спешна помощ.** При непосредствена опасност за живота звънете на **112**.

  ## 4. Кой получава данните

  Не продаваме и не предоставяме данни на трети страни за търговски цели. Данни могат да достигнат до:

  - **Cloudflare, Inc.** – хостинг на сайта и изпращане на съобщенията от формата за контакт (обработващ данни);
  - **Google Ireland Ltd.** – електронната поща на сдружението, в която пристигат съобщенията (обработващ данни);
  - счетоводител, банка и държавни органи – само когато това се изисква по закон.

  Част от тези доставчици могат да обработват данни извън Европейския съюз. Предаването става въз основа на решението на Европейската комисия за Рамката за защита на данните ЕС–САЩ или на стандартни договорни клаузи.

  ## 5. Колко дълго пазим данните

  - запитвания от формата и кореспонденция: до **1 година** след приключване на комуникацията, освен ако не възникне последващо сътрудничество;
  - данни за участници в обучения: до **5 години** за удостоверяване на преминато обучение;
  - счетоводни документи за дарения и плащания: **10 години** според Закона за счетоводството;
  - технически записи (логове) на хостинга: кратко, според политиката на доставчика.

  ## 6. Вашите права

  Имате право на:

  - **достъп** до данните, които обработваме за вас;
  - **коригиране** на неточни данни;
  - **изтриване** („право да бъдеш забравен“);
  - **ограничаване** на обработването;
  - **преносимост** на данните;
  - **възражение** срещу обработване на основание легитимен интерес;
  - **оттегляне на съгласието** по всяко време, без това да засяга законосъобразността на обработването преди оттеглянето.

  За да упражните правата си, пишете ни на [assystbulgaria@gmail.com](mailto:assystbulgaria@gmail.com). Ще отговорим в срок до един месец.

  Имате право и на жалба до **Комисията за защита на личните данни**: гр. София 1592, бул. „Проф. Цветан Лазаров“ № 2, [www.cpdp.bg](https://www.cpdp.bg).

  ## 7. Деца

  Сайтът не е предназначен за самостоятелно предоставяне на данни от деца под 14 години. Когато подкрепата е за дете, моля, свържете се с нас чрез родител или настойник.

  ## 8. Бисквитки

  Публичният сайт не използва бисквитки за проследяване, анализ или реклама. Подробности има в [Политиката за бисквитки](/cookie-policy/).

  ## 9. Сигурност

  Сайтът работи само през защитена връзка (HTTPS). Достъпът до пощата и до администрацията на сайта е ограничен до упълномощени членове на сдружението.

  ## 10. Промени

  Можем да актуализираме тази политика. Актуалната версия е винаги на тази страница, с дата на влизане в сила в началото.
