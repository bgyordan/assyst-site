body: |
  **Политика за поверителност — ASSYST BULGARIA**

  **Кои сме ние**

  Адресът на нашия уебсайт е: https://assyst.bg

  ASSYST BULGARIA е неправителствена организация в обществена полза, регистрирана в България. Можете да се свържете с нас на: assystbulgaria@gmail.com

  ---

  **Коментари**

  Когато посетителите оставят коментари на сайта, ние събираме данните, показани във формата за коментари, както и IP адреса на посетителя и информацията за браузъра, за да помогнем за откриване на спам.

  Анонимизиран низ, създаден от вашия имейл адрес, може да бъде предоставен на услугата Gravatar, за да се провери дали я използвате. Политиката за поверителност на Gravatar е достъпна тук: https://automattic.com/privacy/. След одобрение на вашия коментар, снимката на профила ви е видима публично в контекста на коментара.

  ---

  **Медийни файлове**

  Ако качвате изображения на уебсайта, трябва да избягвате качването на изображения с вградени данни за местоположение (EXIF GPS). Посетителите на уебсайта могат да изтеглят и извлекат данни за местоположение от изображенията на сайта.

  ---

  **Бисквитки (Cookies)**

  Ако оставите коментар на нашия сайт, можете да изберете да запазите вашето име, имейл адрес и уебсайт в бисквитки. Това е за ваше удобство, за да не се налага да попълвате данните си отново при следващ коментар. Тези бисквитки ще продължат една година.

  Ако посетите страницата ни за вход, ще бъде зададена временна бисквитка, за да се определи дали браузърът ви приема бисквитки. Тази бисквитка не съдържа лични данни и се изтрива при затваряне на браузъра.

  При влизане в профила си ще бъдат зададени няколко бисквитки за запазване на информацията за вход и настройките на екрана. Бисквитките за вход продължават два дни, а бисквитките за настройки на екрана — една година. Ако изберете „Запомни ме”, влизането ви ще продължи две седмици. При излизане от профила бисквитките за вход ще бъдат премахнати.

  ---

  **Вградено съдържание от други уебсайтове**

  Статиите на този сайт могат да включват вградено съдържание (напр. видеоклипове, изображения, статии и др.). Вграденото съдържание от други уебсайтове се държи по същия начин, като че ли посетителят е посетил другия уебсайт.

  Тези уебсайтове могат да събират данни за вас, да използват бисквитки, да вграждат допълнително проследяване от трети страни и да наблюдават взаимодействието ви с вграденото съдържание.

  ---

  **С кого споделяме вашите данни**

  Ако поискате нулиране на парола, вашият IP адрес ще бъде включен в имейла за нулиране. Ние не продаваме и не споделяме лични данни с трети страни за търговски цели.

  ---

  **Колко дълго съхраняваме вашите данни**

  Ако оставите коментар, коментарът и неговите метаданни се съхраняват за неопределено време. Това е необходимо, за да можем да разпознаваме и одобряваме автоматично последващи коментари.

  За потребители, регистрирани на уебсайта, съхраняваме и личната информация, предоставена в потребителския им профил. Всички потребители могат да виждат, редактират или изтриват личната си информация по всяко време. Администраторите на уебсайта също могат да виждат и редактират тази информация.

  ---

  **Какви права имате върху вашите данни**

  Ако имате акаунт на този сайт или сте оставили коментари, можете да поискате да получите експортиран файл с личните данни, които съхраняваме за вас. Можете също да поискате да изтрием всички лични данни, които съхраняваме за вас. Това не включва данни, които сме задължени да съхраняваме за административни, правни или сигурностни цели.

  ---

  **Накъде се изпращат вашите данни**

  Коментарите на посетителите могат да бъдат проверявани чрез автоматизирана услуга за откриване на спам.

  ---

  **Контакт**

  За въпроси относно тази политика за поверителност, моля свържете се с нас:

  📧 assystbulgaria@gmail.com 📞 +359 896 878 305 🌐 https://assyst.bg

  *Последна актуализация: май 2026 г.*
