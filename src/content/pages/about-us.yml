title: За нас
slug: about-us
description: ASSYST BULGARIA е неправителствена организация в обществена полза за ранна психологическа подкрепа и психосоциална стабилизация.
hero:
  label: Кои сме ние
  watermark: НАС
  title: Грижа за хората — *в най-трудния момент*
  text: |
    **ASSYST BULGARIA** е неправителствена организация в обществена полза, насочена към ранна психологическа подкрепа и психосоциална стабилизация при бедствия, кризи, масови инциденти и продължителен стрес.

    Организацията работи за развитието на устойчив капацитет за спешна психологическа помощ чрез обучение, теренна работа, супервизия и международно сътрудничество. Част от международната мрежа **ASSYST Humanitarian & Research Projects**, основана от д-р Игнасио Хареро (Мексико).
sections:
  - type: cards
    style: numbered
    columns: 2
    items:
      - { title: Мисия, text: Да осигурява достъпна, научно обоснована и ранна психологическа помощ за хора, засегнати от травматични събития, бедствия и кризи, и да развива обучени професионални екипи за ефективен психосоциален отговор. }
      - { title: Визия, text: Изграждане на устойчива национална мрежа от обучени специалисти, способни да предоставят навременна психологическа стабилизация при извънредни ситуации в България и региона. }
  - type: list
    label: Нашите ценности
    items:
      - Хуманност и уважение към човешкото страдание
      - Научно обоснован подход към всяка интервенция
      - Безопасност и етичност
      - Професионално сътрудничество
      - Достъпност на помощта
      - Доброволчество и обществена отговорност
      - Международно партньорство и обмен на знания
  - type: quote
    text: Помощта трябва да бъде достъпна за всеки, независимо от обстоятелствата.
  - type: team
    label: Управителен съвет
    profiles: true
  - type: text
    label: Учредители
    body: |
      Сдружението е учредено от специалисти в областта на психичното здраве и кризисната интервенция:

      Александра Петрова · Ани Владимирова · Милена Маринова · Росица Петрова · Сибел Джила · София Щерева-Кацарова · Шенай Ибрямова
  - type: text
    label: Членове и професионална мрежа
    body: ASSYST BULGARIA работи чрез мрежа от обучени специалисти в областта на психичното здраве и кризисната интервенция. Членовете и сътрудниците участват доброволно в хуманитарни и обучителни инициативи в България и международни проекти.
