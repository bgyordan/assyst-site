body: |
  ## Какво са бисквитките

  Бисквитките (cookies) са малки текстови файлове, които сайтовете записват в браузъра ви. Някои са необходими, за да работи сайтът. Други служат за анализ на посещенията или за реклама.

  ## Какво използва този сайт

  **Публичният сайт не използва бисквитки за анализ, реклама или проследяване.** Не използваме Google Analytics, Facebook Pixel или подобни инструменти. Шрифтовете се зареждат от нашия сървър, а не от външни услуги.

  | Име | Вид | За какво служи | Срок |
  |---|---|---|---|
  | `assyst_notice` | локално хранилище (localStorage) | запомня, че сте затворили съобщението за бисквитки | докато не го изчистите |
  | `cms_oauth_state` | строго необходима бисквитка | защита при вход в администрацията (само за администратори) | 10 минути |
  | `assyst_session` | строго необходима бисквитка | поддържа сесията на администратор, влязъл в системата | 30 дни |

  Строго необходимите бисквитки не изискват съгласие според чл. 4а от Закона за електронните съобщения. Те се създават само при вход в администрацията, не и при обикновено разглеждане на сайта.

  ## Външни връзки

  Връзките към Facebook и други сайтове отварят съответния сайт. Там важат неговите правила за бисквитки и поверителност. Не вграждаме съдържание от социални мрежи, което да ви проследява на нашия сайт.

  ## Ако това се промени

  Ако в бъдеще добавим инструменти за статистика или вградено съдържание, които използват бисквитки, ще ви поискаме **предварително съгласие** и ще можете да го оттеглите по всяко време.

  ## Как да управлявате бисквитките

  Можете да изтриете или блокирате бисквитките от настройките на браузъра си. Блокирането им няма да попречи на разглеждането на сайта.

  ## Въпроси

  Пишете ни на [assystbulgaria@gmail.com](mailto:assystbulgaria@gmail.com). Повече за обработването на лични данни има в [Политиката за поверителност](/privacy-policy/).
