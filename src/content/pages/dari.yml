title: Дари
slug: dari
description: Подкрепете ASSYST BULGARIA – всяко дарение помага на хора в криза да получат навременна психологическа помощ.
hero:
  label: Подкрепете каузата
  watermark: ДАРИ
  title: Помогнете ни *да помагаме*
  text: ASSYST BULGARIA развива своята дейност чрез доброволчески труд, професионално сътрудничество и дарителска подкрепа. Всяко дарение помага на реални хора в криза да получат навременна психологическа помощ.
sections:
  - type: cards
    label: Вашето дарение подкрепя
    style: numbered
    columns: 2
    items:
      - { title: Теренни мисии, text: Пътувания на екипа и настаняване на доброволци при кризисни интервенции в България и региона. }
      - { title: Обучение и квалификация, text: Специализирани обучения и развитие на екипа по протокола ASSYST — в България и международно. }
      - { title: Обучителни материали, text: Превод и разработване на ресурси за психологическа помощ на български език. }
      - { title: Подкрепа на пострадали общности, text: Организационни разходи при кризисни интервенции и директна помощ за засегнати общности. }
  - type: quote
    text: Помощта трябва да бъде достъпна за всеки, независимо от обстоятелствата.
  - type: text
    heading: Директно банково дарение
    body: |
      Банковите данни за дарение ще бъдат публикувани скоро. Свържете се с нас директно за информация относно дарения.

      ⏳ **Очаква се скоро**
