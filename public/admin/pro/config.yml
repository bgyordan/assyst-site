# Generated by scripts/cms-config.py – edit that file instead.
backend:
  name: github
  repo: bgyordan/assyst-site
  branch: main
  base_url: https://assyst.bg
  auth_endpoint: api/auth
  commit_messages:
    create: 'Ново: {{slug}}'
    update: 'Промяна: {{slug}}'
    delete: 'Изтрито: {{slug}}'
    uploadMedia: 'Качен файл: {{path}}'
    deleteMedia: 'Изтрит файл: {{path}}'
site_url: https://assyst.bg
display_url: https://assyst.bg
logo:
  src: /logo.png
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: '-'
collections:
- name: posts
  label: Новини и статии
  label_singular: публикация
  folder: src/content/posts
  create: true
  slug: '{{title}}'
  extension: md
  format: frontmatter
  sortable_fields:
  - date
  - title
  summary: '{{title}} ({{date | date(''DD.MM.YYYY'')}})'
  preview_path: /{{slug}}/
  fields:
  - name: title
    label: Заглавие
    widget: string
  - name: date
    label: Дата
    widget: datetime
    time_format: false
    date_format: DD.MM.YYYY
    format: YYYY-MM-DD
  - name: categories
    label: Категории
    widget: select
    multiple: true
    options:
    - Новини
    - Публикации
    - Статии
    - Обучения и събития
    default:
    - Новини
  - name: image
    label: Главна снимка
    widget: image
    required: false
  - name: gallery
    label: Още снимки (галерия)
    widget: image
    required: false
    multiple: true
  - name: excerpt
    label: Кратко резюме (за списъка и Google)
    widget: text
    required: false
  - name: draft
    label: Чернова (не се показва на сайта)
    widget: boolean
    required: false
  - name: body
    label: Текст
    widget: markdown
- name: events
  label: Събития и обучения
  label_singular: събитие
  folder: src/content/events
  create: true
  slug: '{{title}}'
  extension: md
  format: frontmatter
  summary: '{{title}} ({{start | date(''DD.MM.YYYY'')}})'
  fields:
  - name: title
    label: Заглавие
    widget: string
  - name: start
    label: Начална дата
    widget: datetime
    time_format: false
    date_format: DD.MM.YYYY
    format: YYYY-MM-DD
  - name: end
    label: Крайна дата
    widget: datetime
    time_format: false
    date_format: DD.MM.YYYY
    format: YYYY-MM-DD
    required: false
  - name: time
    label: Час (напр. 10:00 – 17:00)
    widget: string
    required: false
  - name: location
    label: Място
    widget: string
    required: false
  - name: image
    label: Снимка
    widget: image
    required: false
  - name: gallery
    label: Още снимки (галерия)
    widget: image
    required: false
    multiple: true
  - name: link
    label: Връзка за регистрация
    widget: string
    required: false
  - name: body
    label: Описание
    widget: markdown
- name: team
  label: Екип
  label_singular: член на екипа
  folder: src/content/team
  create: true
  slug: '{{name}}'
  identifier_field: name
  summary: '{{name}} – {{role}}'
  sortable_fields:
  - order
  - name
  fields:
  - name: name
    label: Име
    widget: string
  - name: role
    label: Позиция (напр. Председател на УС)
    widget: string
    required: false
  - name: short
    label: Кратко описание (под снимката)
    widget: string
    required: false
  - name: tagline
    label: Надпис над биографията
    widget: string
    required: false
  - name: photo
    label: Снимка
    widget: image
    required: false
  - name: order
    label: Подредба (1 = първи)
    widget: number
    value_type: int
    default: 10
  - name: body
    label: Биография
    widget: markdown
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    - quote
    required: false
- name: documents
  label: Документи
  label_singular: документ
  folder: src/content/documents
  create: true
  slug: '{{title}}'
  extension: yml
  format: yaml
  sortable_fields:
  - order
  - title
  fields:
  - name: title
    label: Име на документа
    widget: string
  - name: description
    label: Описание
    widget: string
    required: false
  - name: file
    label: Файл (PDF)
    widget: file
    required: false
    hint: Ако няма файл, документът се показва като „Предстои“.
  - name: order
    label: Подредба
    widget: number
    value_type: int
    default: 10
- name: pages
  label: Страници
  label_singular: страница
  files:
  - name: home
    label: Начало
    file: src/content/pages/home.yml
    fields: &id006
    - name: slug
      label: Адрес
      widget: hidden
    - name: title
      label: Заглавие (в менюто и раздела на браузъра)
      widget: string
    - name: description
      label: Описание за Google (до 160 знака)
      widget: text
      required: false
    - name: hero
      label: Горна част (заглавие)
      widget: object
      collapsed: false
      fields:
      - name: label
        label: Малък надпис
        widget: string
        required: false
      - name: title
        label: Голямо заглавие
        widget: string
        hint: Думи между *звездички* се показват в цветен курсив.
      - name: subtitle
        label: Подзаглавие
        widget: string
        required: false
      - name: text
        label: Текст
        widget: markdown
        buttons:
        - bold
        - italic
        - link
        - heading-two
        - heading-three
        - bulleted-list
        - numbered-list
        - quote
        required: false
      - name: watermark
        label: Голям блед надпис на фона
        widget: string
        required: false
      - name: style
        label: Вид
        widget: select
        required: false
        options:
        - label: Светъл
          value: plain
        - label: Голяма снимка
          value: image
      - name: image
        label: Снимка (за вид „Голяма снимка“)
        widget: image
        required: false
      - name: buttons
        label: Бутони
        widget: list
        fields: &id005
        - name: text
          label: Текст
          widget: string
        - name: link
          label: Връзка (напр. /kontakti/)
          widget: string
        - name: outline
          label: Прозрачен бутон
          widget: boolean
          required: false
        required: false
      - name: links
        label: Карти вдясно (само при снимка)
        widget: list
        fields: &id003
        - name: meta
          label: Надзаглавие
          widget: string
          required: false
        - name: title
          label: Заглавие
          widget: string
          required: false
        - name: text
          label: Текст
          widget: text
          required: false
        - name: link
          label: Връзка
          widget: string
          required: false
        required: false
      - name: stats
        label: Числа под снимката
        widget: list
        fields: &id004
        - name: value
          label: Число / стойност
          widget: string
        - name: label
          label: Описание
          widget: string
        required: false
    - name: body
      label: Основен текст (за прости страници)
      widget: markdown
      buttons:
      - bold
      - italic
      - link
      - heading-two
      - heading-three
      - bulleted-list
      - numbered-list
      - quote
      required: false
    - name: sections
      label: Секции на страницата
      widget: list
      required: false
      types:
      - name: text
        label: Текст
        widget: object
        fields:
        - &id001
          name: label
          label: Малък надпис над секцията
          widget: string
          required: false
        - &id002
          name: heading
          label: Заглавие
          widget: string
          hint: Думи между *звездички* се показват в цветен курсив.
          required: false
        - name: body
          label: Текст
          widget: markdown
          buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
          required: false
        - name: aside_big
          label: 'Странично каре: голямо число'
          widget: string
          required: false
        - name: aside_title
          label: 'Странично каре: заглавие'
          widget: string
          required: false
        - name: aside_items
          label: 'Странично каре: списък'
          widget: list
          required: false
        - name: aside_contacts
          label: 'Странично каре: покажи телефон и имейл'
          widget: boolean
          required: false
        - name: aside_note
          label: 'Странично каре: бележка'
          widget: text
          required: false
      - name: cards
        label: Карти
        widget: object
        fields:
        - *id001
        - *id002
        - name: intro
          label: Въвеждащ текст
          widget: markdown
          buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
          required: false
        - name: style
          label: Вид
          widget: select
          required: false
          options:
          - label: Обикновени
            value: plain
          - label: Номерирани (01, 02…)
            value: numbered
          - label: Връзки със стрелка
            value: links
          - label: Букви (ASSYST)
            value: letters
          - label: Времева линия
            value: timeline
        - name: columns
          label: Колони
          widget: select
          options:
          - 2
          - 3
          - 4
          - 6
          default: 3
          required: false
        - name: items
          label: Карти
          widget: list
          fields: *id003
          summary: '{{fields.title}}'
        - name: note
          label: Бележка под картите
          widget: string
          required: false
      - name: stats
        label: Числа (статистика)
        widget: object
        fields:
        - *id001
        - *id002
        - name: stats
          label: Числа
          widget: list
          fields: *id004
          summary: '{{fields.value}} {{fields.label}}'
      - name: mission
        label: Тъмно каре с мисия и числа
        widget: object
        fields:
        - *id001
        - *id002
        - name: text
          label: Текст
          widget: text
          required: false
        - name: stats
          label: Числа
          widget: list
          fields: *id004
          required: false
      - name: list
        label: Списък (ценности / етикети)
        widget: object
        fields:
        - *id001
        - *id002
        - name: style
          label: Вид
          widget: select
          required: false
          options:
          - label: Номериран списък
            value: values
          - label: Етикети
            value: chips
        - name: items
          label: Елементи
          widget: list
      - name: quote
        label: Цитат
        widget: object
        fields:
        - name: text
          label: Цитат
          widget: text
      - name: cta
        label: Призив (синьо каре с бутон)
        widget: object
        fields:
        - name: heading
          label: Заглавие
          widget: string
          hint: Думи между *звездички* се показват в цветен курсив.
        - name: text
          label: Текст
          widget: text
          required: false
        - name: buttons
          label: Бутони
          widget: list
          fields: *id005
          required: false
        - name: contacts
          label: Покажи телефон и имейл
          widget: boolean
          required: false
      - name: team
        label: Екип (от раздел „Екип“)
        widget: object
        fields:
        - *id001
        - *id002
        - name: profiles
          label: Покажи и пълните биографии
          widget: boolean
          required: false
      - name: documents
        label: Документи (от раздел „Документи“)
        widget: object
        fields:
        - *id001
        - *id002
      - name: posts
        label: Последни публикации
        widget: object
        fields:
        - *id001
        - *id002
        - name: count
          label: Брой
          widget: number
          default: 3
          value_type: int
        - name: filters
          label: Покажи филтър по категории
          widget: boolean
          required: false
      - name: events
        label: Събития (от раздел „Събития“)
        widget: object
        fields:
        - *id001
        - *id002
      - name: contact
        label: Контакти + форма
        widget: object
        fields:
        - *id001
      typeKey: type
      summary: '{{fields.label}} {{fields.heading}}'
  - name: about-us
    label: За нас
    file: src/content/pages/about-us.yml
    fields: *id006
  - name: ekip
    label: Екип
    file: src/content/pages/ekip.yml
    fields: *id006
  - name: dokumenti
    label: Документи
    file: src/content/pages/dokumenti.yml
    fields: *id006
  - name: assyst
    label: ASSYST
    file: src/content/pages/assyst.yml
    fields: *id006
  - name: krizisna
    label: Кризисна помощ
    file: src/content/pages/krizisna.yml
    fields: *id006
  - name: dari
    label: Дари
    file: src/content/pages/dari.yml
    fields: *id006
  - name: kontakti
    label: Контакти
    file: src/content/pages/kontakti.yml
    fields: *id006
  - name: blog
    label: Блог
    file: src/content/pages/blog.yml
    fields: *id006
  - name: privacy-policy
    label: Политика за поверителност
    file: src/content/pages/privacy-policy.yml
    fields: *id006
- name: settings
  label: Настройки на сайта
  files:
  - name: site
    label: Контакти, меню и общи
    file: src/data/settings.yml
    fields:
    - name: site_name
      label: Име на сайта
      widget: string
    - name: tagline
      label: Подзаглавие
      widget: string
    - name: logo
      label: Лого
      widget: image
      required: false
    - name: phone
      label: Телефон
      widget: string
    - name: email
      label: Имейл
      widget: string
    - name: facebook
      label: Facebook страница
      widget: string
      required: false
    - name: footer_text
      label: Текст в долния край
      widget: string
      hint: '{year} се заменя с текущата година.'
    - name: menu
      label: Главно меню
      widget: list
      summary: '{{fields.text}}'
      fields:
      - name: text
        label: Текст
        widget: string
      - name: link
        label: Връзка
        widget: string
      - name: children
        label: Подменю
        widget: list
        required: false
        fields:
        - name: text
          label: Текст
          widget: string
        - name: link
          label: Връзка
          widget: string
    - name: donate_button
      label: Бутон „Дари“
      widget: object
      fields:
      - name: text
        label: Текст
        widget: string
      - name: link
        label: Връзка
        widget: string
    - name: categories
      label: Категории на блога
      widget: list
      summary: '{{fields.name}}'
      hint: Ако добавите категория, добавете я и в настройката на „Новини и статии“ (помолете администратора).
      fields:
      - name: name
        label: Име
        widget: string
      - name: slug
        label: Адрес (латиница, напр. novini)
        widget: string
